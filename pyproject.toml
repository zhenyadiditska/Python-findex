[project]
name = "findex"
version = "0.1.0"
description = "Аналіз текстового корпусу з використанням генераторів та потокової обробки"
readme = "README.md"
authors = [
    { name = "Zhenya Didtskaya", email = "9220216@stud.kai.edu.ua" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
findex = "findex:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
